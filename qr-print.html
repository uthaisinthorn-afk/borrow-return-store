<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>พิมพ์ QR อุปกรณ์ | STB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{ font-family:'Noto Sans Thai', sans-serif; background:#f4f5f7; margin:0; padding:24px; }
  .toolbar{ text-align:center; margin-bottom:20px; }
  .toolbar button{
    background:#1a2333; color:#fff; border:0; padding:12px 24px; border-radius:10px;
    font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:14px;
    max-width:1000px; margin:0 auto;
  }
  .card{
    background:#fff; border:1.5px dashed #c3c9d1; border-radius:10px; padding:14px;
    text-align:center;
  }
  .card .qr{ display:flex; justify-content:center; margin-bottom:8px; }
  .card .name{ font-weight:700; font-size:13px; margin-bottom:2px; }
  .card .id{ font-family:monospace; font-size:11px; color:#5a6b80; }
  .card .unit{ font-size:11px; color:#5a6b80; }
  @media print{
    .toolbar{ display:none; }
    body{ background:#fff; padding:0; }
    .card{ break-inside:avoid; border:1px solid #999; }
  }
</style>
</head>
<body>

<div class="toolbar"><button onclick="window.print()">🖨️ พิมพ์ QR ทั้งหมด</button></div>
<div class="grid" id="grid"></div>

<script>
// รายการเดียวกับใน index.html — แก้ไขให้ตรงกันเสมอ
const ITEMS = [
  {id:'ITM001', name:'กระบอกฉีดพ่นแรงดัน POLO 1.5L', unit:'กระบอก'},
  {id:'ITM002', name:'ผ้าเช็ดทำความสะอาด', unit:'ผืน'},
  {id:'ITM003', name:'ถุงมือผ้าฝ้ายขอบเหลือง', unit:'คู่'},
  {id:'ITM004', name:'น้ำยาฆ่าเชื้อพื้นผิว Bossklein', unit:'ขวด'},
  {id:'ITM005', name:'ไม้กวาดดอกหญ้า', unit:'อัน'},
  {id:'ITM006', name:'ไม้กวาดทางมะพร้าว', unit:'อัน'},
  {id:'ITM007', name:'ไม้ถูพื้นแบบเส้นด้าย', unit:'อัน'},
  {id:'ITM008', name:'ไม้ถูพื้นแบบผ้า', unit:'อัน'},
  {id:'ITM009', name:'ไม้ปาดน้ำ/ยางปาดพื้น', unit:'อัน'},
  {id:'ITM010', name:'ที่ตักผง', unit:'อัน'},
  {id:'ITM011', name:'ถังพลาสติกดำ', unit:'ใบ'},
  {id:'ITM012', name:'รองเท้าบูทยางกันน้ำ', unit:'คู่'},
  {id:'ITM013', name:'น้ำยาทำความสะอาด (แกลลอน)', unit:'แกลลอน'},
  {id:'ITM014', name:'ม้วนพลาสติกใส', unit:'ม้วน'},
];

const grid = document.getElementById('grid');
ITEMS.forEach(it => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="qr" id="qr-${it.id}"></div>
    <div class="name">${it.name}</div>
    <div class="id">${it.id}</div>
    <div class="unit">หน่วย: ${it.unit}</div>`;
  grid.appendChild(card);
  new QRCode(document.getElementById('qr-'+it.id), { text: it.id, width:120, height:120 });
});
</script>
</body>
</html>
