<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ระบบยืม-คืนอุปกรณ์แผนก</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --navy:#0e2a3d; --teal:#0f7a72; --green:#1c9c63; --amber:#c9821a; --red:#c0392b;
    --line:#e4e4e0; --muted:#6b7178; --bg:#f6f6f2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Sarabun","Tahoma",sans-serif;background:var(--bg);color:var(--navy);}
  .topbar{background:var(--navy);color:#fff;padding:16px 18px;}
  .topbar h1{font-size:17px;margin:0 0 2px;}
  .topbar .sub{font-size:12px;opacity:.7;}
  .wrap{max-width:520px;margin:0 auto;padding:16px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
  .scan-btn{
    width:100%;background:var(--teal);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;
  }
  input[type="text"]{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;
  }
  .item-list{margin-top:10px;max-height:280px;overflow:auto;}
  .item-row{
    display:flex;justify-content:space-between;align-items:center;padding:10px 4px;
    border-bottom:1px solid var(--line);cursor:pointer;
  }
  .item-row:last-child{border-bottom:none;}
  .item-row .name{font-weight:700;font-size:13.5px;}
  .item-row .meta{font-size:11.5px;color:var(--muted);}
  .badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;}
  .badge.free{background:#e3f6ea;color:var(--green);}
  .badge.borrowed{background:#fdf1e3;color:var(--amber);}
  .badge.issue{background:#eef0fb;color:#4a4ac9;}

  /* item detail card */
  .item-title{font-size:17px;font-weight:700;margin:0 0 2px;}
  .item-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .status-line{font-size:13.5px;margin-bottom:14px;padding:10px 12px;border-radius:10px;background:var(--bg);}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;margin-top:12px;}
  .confirm-btn{
    width:100%;border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:700;color:#fff;cursor:pointer;margin-top:16px;
  }
  .confirm-btn.borrow{background:var(--green);}
  .confirm-btn.return{background:var(--amber);}
  .confirm-btn.issue{background:#4a4ac9;}
  .back-link{display:inline-block;margin-bottom:12px;color:var(--muted);font-size:13px;text-decoration:none;cursor:pointer;}

  /* QR scan overlay */
  .qr-overlay{
    position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:50;
  }
  .qr-overlay.show{display:flex;}
  .qr-overlay video{flex:1;width:100%;object-fit:cover;}
  .qr-overlay .scanHint{color:#fff;text-align:center;padding:14px;font-size:13.5px;}
  .qr-overlay .closeBtn{
    position:absolute;top:14px;right:14px;background:rgba(255,255,255,.15);color:#fff;
    border:none;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;
  }

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;
  }
  .toast.show{opacity:1;}
  .toast.err{background:var(--red);}
</style>
</head>
<body>

<div class="topbar">
  <h1>ระบบยืม-คืนอุปกรณ์แผนก</h1>
  <div class="sub">สแกน QR อุปกรณ์เพื่อยืม / คืน / เบิกใช้</div>
</div>

<div class="wrap" id="app"></div>

<div class="qr-overlay" id="qrOverlay">
  <button class="closeBtn" id="qrCloseBtn">✕</button>
  <video id="qrVideo" playsinline muted></video>
  <div class="scanHint" id="qrHint">ส่องกล้องไปที่ QR code อุปกรณ์</div>
</div>

<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  GAS_URL: "https://script.google.com/macros/s/AKfycbzKc-GG79M9SGNXzgw39eGbzy6FYrZgRFMveJeP0IZNzVmLlbMyJs6HiQzwBBMtP2H8/exec"
};

// สำเนารายการอุปกรณ์ไว้ในเครื่อง เพื่อให้ค้นหา/แสดงรายชื่อได้ทันทีแม้ยังไม่ได้
// เชื่อม backend — สถานะจริง (ว่าง/ถูกยืม) จะดึงจาก backend ตอนเลือกอุปกรณ์เสมอ
const ITEMS = [
  {"code":"ITM001","name":"กระบอกฉีดพ่นแรงดัน POLO 1.5L","unit":"อัน","type":"borrow"},
  {"code":"ITM002","name":"ไม้กวาดดอกหญ้า","unit":"อัน","type":"borrow"},
  {"code":"ITM003","name":"ไม้กวาดทางมะพร้าว","unit":"อัน","type":"borrow"},
  {"code":"ITM004","name":"ไม้ถูพื้นแบบเส้นด้าย (string mop)","unit":"อัน","type":"borrow"},
  {"code":"ITM005","name":"ไม้ถูพื้นแบบผ้า (cloth mop หัวเหล็ก)","unit":"อัน","type":"borrow"},
  {"code":"ITM006","name":"ไม้ปาดน้ำ/ยางปาดพื้น (squeegee)","unit":"อัน","type":"borrow"},
  {"code":"ITM007","name":"ที่ตักผง","unit":"อัน","type":"borrow"},
  {"code":"ITM008","name":"ถังพลาสติกสีดำ (Hi Price)","unit":"ใบ","type":"borrow"},
  {"code":"ITM009","name":"รองเท้าบูทยางกันน้ำ","unit":"คู่","type":"borrow"},
  {"code":"ITM010","name":"ถุงมือผ้าฝ้าย","unit":"คู่","type":"issue"},
  {"code":"ITM011","name":"น้ำยาฆ่าเชื้อพื้นผิว Bossklein","unit":"แกลลอน","type":"issue"},
  {"code":"ITM012","name":"น้ำยาทำความสะอาด (แกลลอนสีม่วง)","unit":"แกลลอน","type":"issue"},
  {"code":"ITM013","name":"ม้วนพลาสติกใส","unit":"ม้วน","type":"issue"},
  {"code":"ITM014","name":"ผ้าเช็ดทำความสะอาด","unit":"ผืน","type":"issue"}
];

function findLocalItem(code){ return ITEMS.find(i => i.code === code); }

function showToast(msg, kind){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (kind === "err" ? " err" : "");
  setTimeout(()=> el.classList.remove("show"), 2600);
}

const params = new URLSearchParams(location.search);
const codeParam = params.get("item");

function init(){
  if (codeParam && findLocalItem(codeParam)){
    openItem(codeParam);
  } else {
    renderPicker();
  }
}

function renderPicker(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <button class="scan-btn" id="scanBtn">📷 สแกน QR เพื่อเลือกอุปกรณ์</button>
      <input type="text" id="searchBox" placeholder="พิมพ์ชื่ออุปกรณ์...">
      <div class="item-list" id="itemList"></div>
    </div>
  `;
  document.getElementById("scanBtn").addEventListener("click", startQrScan);
  const listEl = document.getElementById("itemList");
  function renderList(items){
    listEl.innerHTML = items.map(i => `
      <div class="item-row" data-code="${i.code}">
        <div>
          <div class="name">${i.name}</div>
          <div class="meta">${i.code} · ${i.unit}</div>
        </div>
        <span class="badge ${i.type === 'issue' ? 'issue' : 'free'}">${i.type === 'issue' ? 'เบิกใช้' : 'ยืม-คืน'}</span>
      </div>
    `).join("");
    listEl.querySelectorAll(".item-row").forEach(el=>{
      el.addEventListener("click", ()=> openItem(el.getAttribute("data-code")));
    });
  }
  renderList(ITEMS);
  document.getElementById("searchBox").addEventListener("input", (e)=>{
    const q = e.target.value.trim().toLowerCase();
    renderList(q ? ITEMS.filter(i => i.name.toLowerCase().includes(q) || i.code.toLowerCase().includes(q)) : ITEMS);
  });
}

async function openItem(code){
  const local = findLocalItem(code);
  if (!local){ showToast("ไม่พบอุปกรณ์รหัส " + code + " ในระบบ", "err"); return; }
  history.replaceState(null, "", "?item="+code);

  const app = document.getElementById("app");
  app.innerHTML = `<div class="card"><div class="status-line">⏳ กำลังตรวจสอบสถานะ...</div></div>`;

  let info = { found: true, code: local.code, name: local.name, unit: local.unit, type: local.type, status: "ว่าง", currentBorrower: "" };
  if (CONFIG.GAS_URL){
    try{
      const resp = await fetch(CONFIG.GAS_URL + "?action=iteminfo&code=" + encodeURIComponent(code));
      const data = await resp.json();
      if (data.found) info = data;
    }catch(e){ console.error(e); }
  }
  renderItemDetail(info);
}

function renderItemDetail(info){
  const app = document.getElementById("app");
  let bodyHtml = "";

  if (info.type === "borrow"){
    if (info.status === "ถูกยืม"){
      bodyHtml = `
        <div class="status-line">🟠 สถานะ: <b>ถูกยืมอยู่</b> โดย ${info.currentBorrower || "-"}${info.borrowedAt ? (" ตั้งแต่ " + info.borrowedAt) : ""}</div>
        <label>ชื่อผู้คืน</label>
        <input type="text" id="userInput" placeholder="ชื่อ-นามสกุล">
        <button class="confirm-btn return" id="confirmBtn">✅ ยืนยันการคืน</button>
      `;
    } else {
      bodyHtml = `
        <div class="status-line">🟢 สถานะ: <b>ว่าง พร้อมให้ยืม</b></div>
        <label>ชื่อผู้ยืม</label>
        <input type="text" id="userInput" placeholder="ชื่อ-นามสกุล" value="${localStorage.getItem('br_last_user')||''}">
        <button class="confirm-btn borrow" id="confirmBtn">📤 ยืนยันการยืม</button>
      `;
    }
  } else {
    bodyHtml = `
      <div class="status-line">📦 อุปกรณ์ประเภทเบิกใช้ (ไม่ต้องคืน)</div>
      <label>ชื่อผู้เบิก</label>
      <input type="text" id="userInput" placeholder="ชื่อ-นามสกุล" value="${localStorage.getItem('br_last_user')||''}">
      <label>จำนวนที่เบิก</label>
      <input type="text" id="qtyInput" inputmode="numeric" placeholder="เช่น 1" value="1">
      <button class="confirm-btn issue" id="confirmBtn">📤 ยืนยันการเบิก</button>
    `;
  }

  app.innerHTML = `
    <a class="back-link" id="backLink">← เลือกอุปกรณ์อื่น</a>
    <div class="card">
      <div class="item-title">${info.name}</div>
      <div class="item-sub">${info.code} · หน่วย: ${info.unit}</div>
      ${bodyHtml}
    </div>
  `;
  document.getElementById("backLink").addEventListener("click", ()=>{ location.href = location.pathname; });
  document.getElementById("confirmBtn").addEventListener("click", ()=> submitAction(info));
}

async function submitAction(info){
  const userInput = document.getElementById("userInput");
  const user = userInput.value.trim();
  if (!user){ showToast("กรุณาระบุชื่อผู้ทำรายการ", "err"); userInput.focus(); return; }
  localStorage.setItem("br_last_user", user);

  let action = "issue";
  let qty = 1;
  if (info.type === "borrow"){
    action = info.status === "ถูกยืม" ? "return" : "borrow";
  } else {
    const qtyEl = document.getElementById("qtyInput");
    qty = qtyEl ? (qtyEl.value.trim() || 1) : 1;
  }

  const btn = document.getElementById("confirmBtn");
  btn.disabled = true;
  btn.textContent = "กำลังบันทึก...";

  if (!CONFIG.GAS_URL){
    showToast("ยังไม่ได้ตั้งค่า GAS_URL ในไฟล์นี้", "err");
    btn.disabled = false;
    return;
  }

  try{
    const resp = await fetch(CONFIG.GAS_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ action, code: info.code, user, qty })
    });
    const data = await resp.json();
    if (data.status === "ok"){
      showToast(action === "borrow" ? "บันทึกการยืมแล้ว" : action === "return" ? "บันทึกการคืนแล้ว" : "บันทึกการเบิกแล้ว", "ok");
      setTimeout(()=>{ location.href = location.pathname; }, 1200);
    } else {
      showToast(data.message || "เกิดข้อผิดพลาด", "err");
      btn.disabled = false;
      btn.textContent = "ลองใหม่อีกครั้ง";
    }
  }catch(e){
    showToast("เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง", "err");
    btn.disabled = false;
  }
}

// ---------- QR scanner ----------
let qrStream = null;
let qrRAF = null;

async function startQrScan(){
  const overlay = document.getElementById("qrOverlay");
  const video = document.getElementById("qrVideo");
  const hint = document.getElementById("qrHint");
  overlay.classList.add("show");
  try{
    qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = qrStream;
    await video.play();
    hint.textContent = "ส่องกล้องไปที่ QR code อุปกรณ์";
    scanFrame();
  }catch(e){
    hint.textContent = "เปิดกล้องไม่สำเร็จ — ตรวจสอบสิทธิ์การใช้กล้อง";
  }
}
function stopQrScan(){
  if (qrRAF) cancelAnimationFrame(qrRAF);
  if (qrStream) qrStream.getTracks().forEach(t=>t.stop());
  qrStream = null;
  document.getElementById("qrOverlay").classList.remove("show");
}
function scanFrame(){
  const video = document.getElementById("qrVideo");
  if (!video.videoWidth){ qrRAF = requestAnimationFrame(scanFrame); return; }
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(imageData.data, imageData.width, imageData.height);
  if (code && code.data){ handleQrDecoded(code.data); return; }
  qrRAF = requestAnimationFrame(scanFrame);
}
function handleQrDecoded(text){
  let itemCode = null;
  try{
    const url = new URL(text);
    itemCode = url.searchParams.get("item");
  }catch(e){
    itemCode = text.trim();
  }
  stopQrScan();
  if (itemCode && findLocalItem(itemCode)){
    openItem(itemCode);
  } else {
    showToast("QR นี้ไม่ตรงกับอุปกรณ์ในระบบ", "err");
  }
}
document.getElementById("qrCloseBtn").addEventListener("click", stopQrScan);

init();
</script>
</body>
</html>
